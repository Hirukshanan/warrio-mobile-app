name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Keep enough heap for Compose, lint and the bundled ML Kit model.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 21 and Gradle dependency cache
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            gradle.properties

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'

      - name: Run unit tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: bash ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Upload verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warrio-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
